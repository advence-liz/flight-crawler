<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小红书推广物料预览</title>
<style>
  body { background: #f5f5f7; font-family: "PingFang SC","Microsoft YaHei",sans-serif; margin: 0; padding: 40px 0; }
  .wrap { max-width: 420px; margin: 0 auto; }
  h1 { text-align: center; font-size: 20px; color: #333; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 16px; overflow: hidden; margin-bottom: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .card img { width: 100%; display: block; }
  .copy { max-width: 420px; margin: 0 auto 32px; background: #fff; border-radius: 16px; padding: 24px 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); white-space: pre-wrap; line-height: 1.7; font-size: 15px; color: #222; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>📱 小红书图文预览</h1>
    <div class="card"><img src="assets/card-1-cover.png"></div>
    <div class="card"><img src="assets/card-2-destination.png"></div>
    <div class="card"><img src="assets/card-3-route-planner.png"></div>
    <div class="card"><img src="assets/card-4-map.png"></div>
  </div>
  <div class="copy" id="copy">加载文案中...</div>
  <script>
    fetch('copy.md').then(r => r.text()).then(t => { document.getElementById('copy').textContent = t; });
  </script>
</body>
</html>
