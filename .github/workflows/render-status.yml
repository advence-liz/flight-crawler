name: render-status

# 临时排查用：查看 Render 上各服务最近一次部署的状态（不会输出 API Key）
"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: List services
        run: |
          curl -sf "https://api.render.com/v1/services?limit=50" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            | jq -r '.[] | "\(.service.id)  \(.service.name)  type=\(.service.type)  branch=\(.service.branch)  autoDeploy=\(.service.autoDeploy)  repo=\(.service.repo // "-")  suspended=\(.service.suspended)"'
      - name: Latest deploys
        run: |
          for id in $(curl -sf "https://api.render.com/v1/services?limit=50" -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.[].service.id'); do
            echo "=== $id ==="
            curl -sf "https://api.render.com/v1/services/$id/deploys?limit=3" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              | jq -r '.[] | "\(.deploy.createdAt)  status=\(.deploy.status)  commit=\(.deploy.commit.id[0:7])  \(.deploy.commit.message | split("\n")[0])"'
          done
