name: daily-crawl

"on":
  schedule:
    # 每 6 小时一次（00/06/12/18 UTC = 北京 08:00 / 14:00 / 20:00 / 次日 02:00）
    #
    # 为什么不更密：实测 GitHub 对本仓库的计划任务有明显限流——
    #   */5（5 分钟）   → 7 天 0 次
    #   */2（2 小时）   → 14 小时只跑了 1 次
    #   0 18 * * *（每天）→ 每天都能跑，但延迟 3~5 小时
    # 单次 run 本身要 40~48 分钟（30 天 × 44 机场 × 2 卡种），
    # 设 4 个时段是为了在限流下多几次机会，又不至于写成明显的滥用频率。
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: '跳过真实爬取，仅用仓库自带的 db 验证「发布到 data 分支 + 触发 Render 重新构建」链路'
        type: boolean
        default: false
      days:
        description: '爬取未来多少天（1-30）'
        type: string
        default: '30'

permissions:
  contents: write

# 同一时间只跑一个爬取任务：间隔压到 2 小时后，单次要跑 40 多分钟，
# 万一上一轮超时，这里排队等它结束，避免两轮同时爬同一批页面 + 重复部署
concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      # 页面固定等待的缩放系数，默认 1（不缩放）。
      # 实测 0.8 在某些航线上会静默返回 0 条（页面没渲染完就点查询），
      # 而爬取是"先删后写"，0 条会把当天数据清空——风险大于收益，保持 1。
      # 真要提速得改成事件驱动等待（等接口响应而不是睡固定时长），那是独立改造。
      CRAWL_WAIT_SCALE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # puppeteer 的 postinstall 脚本每次都会从 Google 的 CDN 现下 Chromium（~200MB+），
      # 之前两次连续卡住都精确停在这一步——npm 本身的 registry 缓存（上面 cache:'npm'）
      # 覆盖不到这个下载，因为它不是走 npm registry，得单独缓存 puppeteer 的实际下载目录。
      # 缓存命中后这步只需要几秒，不再依赖那个 CDN 是否稳定
      - name: 缓存 puppeteer 的 Chromium 下载
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chromium-${{ hashFiles('backend/package-lock.json') }}

      # npm ci 实测要 5 分钟，占整轮的 10%。node_modules 按 lockfile 精确缓存，
      # 命中就直接跳过安装（runner 镜像是固定的，原生模块可以复用）
      - name: 缓存 node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: node-modules-${{ hashFiles('backend/package-lock.json') }}

      - name: 安装后端依赖（含 puppeteer，CI 环境不省这个）
        if: ${{ github.event.inputs.skip_crawl != 'true' && steps.nm-cache.outputs.cache-hit != 'true' }}
        working-directory: backend
        # 网络抖动时 npm ci 本身没有超时兜底，历史上出现过卡满 300 分钟 job 超时的情况。
        # 步骤级 timeout-minutes 只能兜底"整体卡死"，但如果第一次 npm ci 本身被这个
        # 超时杀掉，shell 层面的 `||` 重试根本来不及触发——所以每次尝试单独用 `timeout`
        # 包一层（5 分钟一次机会），卡住就换下一次尝试，而不是白等到步骤超时
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            echo "▶ npm ci 第 $attempt 次尝试"
            if timeout 300 npm ci; then
              exit 0
            fi
            echo "::warning::第 $attempt 次 npm ci 失败/超时"
          done
          echo "::error::npm ci 连续两次失败/超时"
          exit 1

      - name: 准备运行环境
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          PORT=3000
          NODE_ENV=production
          DB_TYPE=sqlite
          DB_DATABASE=./data/flight-crawler.db
          CRAWLER_ENABLED=true
          CRAWLER_HEADLESS=true
          CRAWLER_TIMEOUT=30000
          CRAWLER_MAX_RETRIES=3
          CRAWLER_AUTO_CRAWL=false
          CORS_ORIGIN=*
          EOF
          mkdir -p data logs

      - name: 构建后端
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: backend
        run: npm run build

      - name: 启动后端
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: backend
        run: |
          nohup node dist/main.js > "$GITHUB_WORKSPACE/server.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/server.pid"
          for i in $(seq 1 30); do
            sleep 1
            curl -sf http://localhost:3000/api/health >/dev/null 2>&1 && { echo "后端已就绪"; exit 0; }
          done
          echo "::error::后端启动超时"; cat "$GITHUB_WORKSPACE/server.log"; exit 1

      - name: 发现机场（保持机场列表最新，异步任务，需轮询到完成再继续）
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        run: |
          RESP=$(curl -sf -X POST http://localhost:3000/api/crawler/initialize/discover \
            -H "Content-Type: application/json" -d '{"days":1}')
          echo "$RESP"
          TASK_ID=$(node -e "console.log(JSON.parse(process.argv[1]).taskId)" "$RESP")
          if [ -z "$TASK_ID" ] || [ "$TASK_ID" = "undefined" ]; then
            echo "::error::发现机场未拿到 taskId"; exit 1
          fi
          for i in $(seq 1 60); do   # discover 历史耗时 <3 分钟，最长等 15 分钟
            sleep 15
            LOG=$(curl -sf "http://localhost:3000/api/crawler/logs/$TASK_ID")
            STATUS=$(node -e "console.log(JSON.parse(process.argv[1]).status)" "$LOG")
            echo "[discover $i] status=$STATUS"
            if [ "$STATUS" = "success" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then echo "::error::发现机场任务失败"; echo "$LOG"; exit 1; fi
            if [ "$i" = "60" ]; then echo "::error::发现机场轮询超时"; exit 1; fi
          done

      - name: 爬取（失败自动重试一次）
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        run: |
          # 手动触发用输入值；定时任务统一刷未来 30 天
          DAYS="${{ github.event.inputs.days || '30' }}"
          START=$(date -u +%F)
          END=$(date -u -d "+${DAYS} days" +%F)

          for attempt in 1 2; do
            echo "▶ 第 $attempt 次爬取（窗口 $START ~ $END）"
            RESP=$(curl -sf -X POST http://localhost:3000/api/crawler/initialize/refresh \
              -H "Content-Type: application/json" \
              -d "{\"startDate\":\"$START\",\"endDate\":\"$END\"}") || { echo "::warning::触发失败"; sleep 30; continue; }
            TASK_ID=$(node -e "console.log(JSON.parse(process.argv[1]).taskId)" "$RESP" 2>/dev/null)
            if [ -z "$TASK_ID" ] || [ "$TASK_ID" = "undefined" ]; then
              echo "::warning::未拿到 taskId"; sleep 30; continue
            fi

            # 轮询到结束（最长 1080*15s = 4.5 小时）
            OK=0
            for i in $(seq 1 1080); do
              sleep 15
              LOG=$(curl -sf "http://localhost:3000/api/crawler/logs/$TASK_ID" || true)
              STATUS=$(node -e "console.log(JSON.parse(process.argv[1]).status)" "$LOG" 2>/dev/null)
              if [ $((i % 20)) -eq 0 ]; then echo "[$attempt][$i] status=$STATUS"; fi
              if [ "$STATUS" = "success" ]; then echo "$LOG"; OK=1; break; fi
              if [ "$STATUS" = "failed" ]; then echo "::warning::爬取任务失败"; echo "$LOG"; break; fi
            done
            if [ "$OK" = "1" ]; then exit 0; fi
            echo "::warning::第 $attempt 次爬取未成功"
            sleep 30
          done

          echo "::error::连续两次爬取都失败，本轮放弃（不发布，线上数据保持不变）"
          exit 1

      - name: 清理查询缓存 + 旧执行日志（控制 db 体积）
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        run: |
          echo "清理 query_cache（destinations + transfer 查询缓存，不需要随 db 分发）..."
          curl -sf -X DELETE http://localhost:3000/api/crawler/cache/clear || true
          echo "清理 30 天前的执行日志..."
          curl -sf -X DELETE http://localhost:3000/api/crawler/logs/clean \
            -H "Content-Type: application/json" -d '{"days":30}' || true

      - name: 停止后端
        if: ${{ github.event.inputs.skip_crawl != 'true' && always() }}
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: 清理越界/过期航班并 VACUUM 压缩体积
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
          DB=backend/data/flight-crawler.db
          echo "清理前：$(du -h "$DB" | cut -f1)"
          sqlite3 "$DB" "DELETE FROM flights WHERE departureTime < datetime('now');"
          sqlite3 "$DB" "DELETE FROM flights WHERE departureTime > datetime('now', '+31 days');"
          sqlite3 "$DB" "VACUUM;"
          echo "清理后：$(du -h "$DB" | cut -f1)"

      - name: 发布前数据量校验（防止异常爬取把线上数据冲掉）
        run: |
          DB=backend/data/flight-crawler.db
          NEW=$(sqlite3 "$DB" "SELECT COUNT(*) FROM flights;" 2>/dev/null || echo 0)
          OLD=$(curl -sf -m 30 https://flight-crawler.onrender.com/api/flights/data-freshness \
                | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).total||0)}catch{console.log(0)}})")
          echo "本次 $NEW 条 / 线上 $OLD 条"
          if [ "${OLD:-0}" -gt 0 ] && [ "$NEW" -lt $(( OLD * 5 / 10 )) ]; then
            echo "::error::新数据只有 $NEW 条，不足线上 $OLD 条的一半，疑似爬取异常，已中止发布"
            exit 1
          fi

      - name: 发布 db 到 data 分支（orphan force-push，不进 main 历史）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          DB_PATH="$GITHUB_WORKSPACE/backend/data/flight-crawler.db"
          TMP_DIR=$(mktemp -d)
          git clone --depth=1 --branch=data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TMP_DIR"
          mkdir -p "$TMP_DIR/backend/data"
          cp "$DB_PATH" "$TMP_DIR/backend/data/flight-crawler.db"
          cd "$TMP_DIR"
          git add -f backend/data/flight-crawler.db
          git commit --allow-empty -m "data: 自动更新航班数据库 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 触发 Render 重新构建部署
        if: ${{ env.RENDER_API_KEY != '' }}
        run: |
          curl -sf -X POST "https://api.render.com/v1/services/srv-d6t91fua2pns738l8iqg/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'
          echo "已触发 Render 重新部署"
