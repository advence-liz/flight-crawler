name: keepalive-ping

# 保活：Render 免费实例 15 分钟没有入站请求就休眠，下一次请求要 15~40 秒才恢复，
# 而且休眠后内存缓存（航班图、中转图）全丢，首个查询还要重新算。
# 这里每 5 分钟打一次 /api/health，让它一直醒着。
#
# 代价：本仓库是 public，GitHub Actions 分钟数不计量，纯白嫖。

"on":
  schedule:
    # 每 5 分钟一次（GitHub cron 的最小粒度就是 5 分钟）
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: |
          URL="https://flight-crawler.onrender.com/api/health"
          # 实例可能在冷启动，单次最多等 60 秒；失败重试 3 次
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' "$URL" || true)
            code=${code:-000}
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::后端连续 3 次未响应，可能已经挂掉或正在重新部署"
          exit 1
