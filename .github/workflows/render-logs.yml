name: render-logs

# 排查用：拉取 Render 后端服务最近几小时的日志，按 10 分钟分桶统计请求量，
# 用来判断「到底有没有东西在定时唤醒实例」。
"on":
  workflow_dispatch:
    inputs:
      hours:
        description: '回溯小时数'
        default: '3'
      text:
        description: '只保留包含该文本的日志（留空=全部）'
        default: ''

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Fetch logs
        run: |
          set -euo pipefail
          HOURS="${{ inputs.hours }}"
          HOURS=${HOURS:-3}

          OWNER=$(curl -sf "https://api.render.com/v1/owners" -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.[0].owner.id')
          echo "ownerId=$OWNER"

          SVC=$(curl -sf "https://api.render.com/v1/services?limit=50" -H "Authorization: Bearer ${RENDER_API_KEY}" \
            | jq -r '.[] | select(.service.type=="web_service") | .service.id')
          echo "webService=$SVC"

          START=$(date -u -d "${HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "window=$START ~ $END"

          TEXT="${{ inputs.text }}"
          curl -sf -G "https://api.render.com/v1/logs" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            --data-urlencode "ownerId=${OWNER}" \
            --data-urlencode "resource=${SVC}" \
            --data-urlencode "startTime=${START}" \
            --data-urlencode "endTime=${END}" \
            --data-urlencode "limit=100" \
            --data-urlencode "direction=backward" \
            ${TEXT:+--data-urlencode "text=${TEXT}"} > /tmp/logs.json

          echo "returned=$(jq '.logs | length' /tmp/logs.json) hasMore=$(jq '.hasMore' /tmp/logs.json)"
          echo "=== 按 10 分钟分桶（全部日志条数） ==="
          jq -r '.logs[].timestamp' /tmp/logs.json \
            | sed -E 's/^([0-9]{4}-[0-9]{2}-[0-9]{2})T([0-9]{2}):([0-9])[0-9]/[\1 \2:\30]/' \
            | sort | uniq -c

          echo "=== 最近 40 条原始日志 ==="
          jq -r '.logs[:40][] | "\(.timestamp)  \(.message)"' /tmp/logs.json

          echo "=== 请求路径统计 ==="
          jq -r '.logs[].message' /tmp/logs.json \
            | grep -oE '(GET|POST) /api/[^ ]*' | sort | uniq -c | sort -rn | head -20 || echo '(无 HTTP 请求日志)'

          echo "=== UA 统计（区分真人 / 保活探针） ==="
          jq -r '.logs[].message' /tmp/logs.json \
            | grep -oE 'ua="[^"]*"' | sort | uniq -c | sort -rn | head -20 || echo '(日志里还没有 UA 字段)'

          echo "=== 第一条日志的完整结构（看 labels 里有没有 IP 等字段） ==="
          jq '.logs[0]' /tmp/logs.json
