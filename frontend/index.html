<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>随心飞特价行程分析工具</title>

    <!-- 提前建立到接口域名（Render 后端）的连接：国内到美国机房每个 RTT 150~250ms，
         提前握手能把首个接口请求省下 2~3 个 RTT -->
    <link rel="dns-prefetch" href="https://flight-crawler.onrender.com" />
    <link rel="preconnect" href="https://flight-crawler.onrender.com" crossorigin />

    <!-- 首屏骨架：JS 体积 ~400KB(gzip)，国内慢网下要等几秒才有内容，
         这段纯 CSS 骨架先顶上，React 挂载后自动被替换 -->
    <style>
      html, body { margin: 0; background: #f5f5f5; }
      .boot-bar { height: 64px; background: #001529; }
      .boot-wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
      .boot-card {
        background: #fff; border-radius: 8px; padding: 24px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .boot-row { display: flex; gap: 12px; flex-wrap: wrap; }
      .boot-item { flex: 1 1 160px; }
      .boot-label, .boot-field {
        border-radius: 4px;
        background: linear-gradient(90deg, #f0f0f0 25%, #f7f7f7 37%, #f0f0f0 63%);
        background-size: 400% 100%;
        animation: boot-shimmer 1.4s ease infinite;
      }
      .boot-label { width: 48px; height: 12px; margin-bottom: 8px; }
      .boot-field { height: 32px; }
      @keyframes boot-shimmer {
        0% { background-position: 100% 50%; }
        100% { background-position: 0 50%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-label, .boot-field { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-bar"></div>
      <div class="boot-wrap">
        <div class="boot-card">
          <div class="boot-row">
            <div class="boot-item"><div class="boot-label"></div><div class="boot-field"></div></div>
            <div class="boot-item"><div class="boot-label"></div><div class="boot-field"></div></div>
            <div class="boot-item"><div class="boot-label"></div><div class="boot-field"></div></div>
            <div class="boot-item"><div class="boot-label"></div><div class="boot-field"></div></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
